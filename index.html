<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="이번 주 업무 진행률을 실시간으로 계산하는 간단한 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>금주 업무 진행률</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--accent:#2563eb;--soft:#eff6ff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#f3f6fb;color:var(--ink);min-height:100vh}
main{width:min(680px,100%);margin:0 auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom))}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
h1{font-size:28px;margin:0 0 7px;letter-spacing:-.04em}
.sub{color:var(--muted);margin:0 0 24px;line-height:1.55;font-size:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:14px;color:#475569;font-weight:700;margin-bottom:8px}
input[type=time]{width:100%;min-width:0;border:1px solid var(--line);border-radius:13px;padding:14px 10px;font:inherit;font-size:21px;color:var(--ink);background:#fff}
.section{margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}
.current{display:flex;justify-content:space-between;align-items:center;gap:10px}
.time{font-size:clamp(28px,8vw,36px);font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.pill{background:var(--soft);color:var(--accent);padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.progress-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 10px}
.progress-label{margin:0;font-size:15px;color:#475569;font-weight:700}
.percent{font-size:46px;font-weight:900;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.track{height:14px;background:#e8edf5;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#2563eb,#38bdf8);border-radius:999px;transition:width .25s ease}
.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.detail{padding:14px;border-radius:14px;background:#f8fafc}
.k{color:var(--muted);font-size:12px;margin-bottom:7px}
.v{font-weight:800;font-size:16px}
.note{margin:16px 0 0;color:var(--muted);font-size:12px;line-height:1.65}
button{border:0;border-radius:12px;padding:12px 14px;background:#2563eb;color:#fff;font:inherit;font-weight:750;width:100%;margin-top:18px}
@media(max-width:380px){.panel{padding:17px}.pill{font-size:10px;padding:6px 8px}.detail{padding:11px}.v{font-size:14px}}
</style>
</head>
<body>
<main>
<section class="panel">
<h1>금주 업무 진행률</h1>
<p class="sub">출근·퇴근 시간을 설정하면 이번 주 업무 진행률을 자동으로 계산합니다.</p>
<div class="fields">
<div><label for="start">출근</label><input id="start" type="time" value="08:00"></div>
<div><label for="end">퇴근</label><input id="end" type="time" value="17:00"></div>
</div>
<div class="section">
<div class="current">
<div><label style="margin-bottom:5px">현재시간</label><div class="time" id="now">00:00:00</div></div>
<span class="pill">실시간 자동 갱신</span>
</div>
<div class="progress-head"><p class="progress-label">진행율</p><div class="percent" id="percent">0%</div></div>
<div class="track" id="track" role="progressbar" aria-label="금주 업무 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div>
<div class="details">
<div class="detail"><div class="k">이번 주 경과 업무시간</div><div class="v" id="elapsed">0시간 0분</div></div>
<div class="detail"><div class="k">이번 주 예정 업무시간</div><div class="v" id="total">40시간 0분</div></div>
</div>
<p class="note" id="week"></p>
<p class="note">기본 기준: 월~금 근무, 점심시간 1시간 제외. 주말은 계산에서 제외됩니다. 출근·퇴근 시간은 이 기기에 저장됩니다.</p>
<button id="reset" type="button">기본 시간으로 초기화</button>
</div>
</section>
</main>
<script>
(() => {
const $=id=>document.getElementById(id);
const startEl=$('start'),endEl=$('end');
const saved=JSON.parse(localStorage.getItem('work-hours')||'{}');
if(saved.start)startEl.value=saved.start;
if(saved.end)endEl.value=saved.end;
function mins(v){if(!v||!/^\d{2}:\d{2}$/.test(v))return null;const [h,m]=v.split(':').map(Number);return h*60+m}
function dur(n){n=Math.max(0,Math.round(n));return `${Math.floor(n/60)}시간 ${n%60}분`}
function dateFmt(d){return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
function at(d,m){const x=new Date(d);x.setHours(Math.floor(m/60),m%60,0,0);return x}
function elapsedForDay(d,now,s,e){
 const dow=d.getDay();if(dow===0||dow===6||e<=s)return 0;
 const a=at(d,s),b=at(d,e),cap=new Date(Math.min(now.getTime(),b.getTime()));
 const raw=Math.max(0,(cap-a)/60000);
 return Math.max(0,Math.min(e-s,raw)-Math.min(60,Math.max(0,Math.min(raw,e-s))));
}
function update(){
 const now=new Date();
 $('now').textContent=now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 const s=mins(startEl.value),e=mins(endEl.value);
 if(s===null||e===null||e<=s){$('percent').textContent='—';$('bar').style.width='0%';$('elapsed').textContent='시간 설정 확인';$('total').textContent='—';$('week').textContent='퇴근 시간은 출근 시간보다 늦게 설정해 주세요.';$('track').setAttribute('aria-valuenow','0');return}
 const daily=Math.max(0,e-s-60),total=daily*5;
 const monday=new Date(now);monday.setHours(0,0,0,0);const dow=monday.getDay();monday.setDate(monday.getDate()+(dow===0?-6:1-dow));
 let elapsed=0;for(let i=0;i<5;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);elapsed+=elapsedForDay(d,now,s,e)}
 elapsed=Math.max(0,Math.min(total,elapsed));const pct=total?Math.max(0,Math.min(100,elapsed/total*100)):0;
 $('percent').textContent=`${pct.toFixed(1)}%`;$('bar').style.width=`${pct}%`;$('track').setAttribute('aria-valuenow',String(Math.round(pct)));
 $('elapsed').textContent=dur(elapsed);$('total').textContent=dur(total);
 const friday=new Date(monday);friday.setDate(monday.getDate()+4);$('week').textContent=`산정 기간: ${dateFmt(monday)} ~ ${dateFmt(friday)}`;
}
function save(){localStorage.setItem('work-hours',JSON.stringify({start:startEl.value,end:endEl.value}));update()}
startEl.addEventListener('input',save);endEl.addEventListener('input',save);
$('reset').addEventListener('click',()=>{startEl.value='08:00';endEl.value='17:00';save()});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
update();setInterval(update,1000);
})();
</script>
</body>
</html>
